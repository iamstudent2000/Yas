name: Cleanup Positions page styles

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-positions-style.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move inline Positions styles
        shell: python
        run: |
          from pathlib import Path
          import re

          page = Path('src/YasPortal.Web/Components/Pages/Admin/Positions.razor')
          css = Path('src/YasPortal.Web/wwwroot/css/positions.css')
          app = Path('src/YasPortal.Web/Components/App.razor')

          text = page.read_text(encoding='utf-8')
          match = re.search(r'\n<style>\n(.*?)\n</style>\s*\Z', text, re.S)
          if not match:
              raise SystemExit('Positions.razor does not contain the expected trailing style block.')

          css.parent.mkdir(parents=True, exist_ok=True)
          css.write_text('/* YasPortal Positions page */\n' + match.group(1).replace('@@media', '@media') + '\n', encoding='utf-8')
          page.write_text(text[:match.start()] + '\n', encoding='utf-8')

          app_text = app.read_text(encoding='utf-8')
          link = '    <link rel="stylesheet" href="css/positions.css" />\n'
          if 'href="css/positions.css"' not in app_text:
              marker = '    <link rel="stylesheet" href="css/admin-ui.css?v=20260819-3" />\n'
              if marker not in app_text:
                  raise SystemExit('Could not find admin-ui.css link in App.razor.')
              app_text = app_text.replace(marker, marker + link, 1)
              app.write_text(app_text, encoding='utf-8')
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/cleanup-positions-style.yml
          git add src/YasPortal.Web/Components/Pages/Admin/Positions.razor src/YasPortal.Web/wwwroot/css/positions.css src/YasPortal.Web/Components/App.razor .github/workflows/cleanup-positions-style.yml
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: move positions styles to css'
          git push